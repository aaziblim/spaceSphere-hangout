# ============================================================================
# Docker Compose - Base Configuration
# ============================================================================
# Use with overlays:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend Service (Django + Gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spherespace-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-spherespace}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spherespace-network
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Frontend Service (Nginx + React)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spherespace-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - spherespace-network
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: spherespace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spherespace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spherespace-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spherespace}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Service (Caching & Sessions)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spherespace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - spherespace-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # LiveKit Service (Audio SFU for Spheres)
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: spherespace-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}:${LIVEKIT_API_SECRET:-secret_that_is_at_least_32_characters}
    command: >
      --dev
      --bind 0.0.0.0
      --port 7880
      --rtc.port-range-start 50000
      --rtc.port-range-end 50100
      --rtc.tcp-port 7881
      --redis-address redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spherespace-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:7880" ]
      interval: 15s
      timeout: 5s
      retries: 5

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: spherespace-postgres-data
  redis_data:
    name: spherespace-redis-data
  static_volume:
    name: spherespace-static
  media_volume:
    name: spherespace-media

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  spherespace-network:
    name: spherespace-network
    driver: bridge
