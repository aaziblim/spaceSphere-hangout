<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 20px;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="padding:40px 32px;">
          <h1 style="margin:0 0 8px;font-size:22px;color:#1a1a1a;">Reset your password</h1>
          <p style="margin:0 0 24px;font-size:15px;color:#666;line-height:1.5;">
            Hi {{ username }}, we received a request to reset your password. Click the button below to choose a new one.
          </p>
          <a href="{{ reset_url }}" style="display:inline-block;padding:12px 32px;background-color:#6366f1;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:600;">
            Reset Password
          </a>
          <p style="margin:24px 0 0;font-size:13px;color:#999;line-height:1.5;">
            This link expires in {{ expiry_hours }} hours. If you didn't request a password reset, ignore this email.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
